<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엄마 레시피</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #fffef8;
      --panel: #ffffff;
      --line: #d9d9d9;
      --line-strong: #111111;
      --green: #34780f;
      --blue: #005fcc;
      --red: #b42318;
      --gold: #f5b400;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 95, 204, 0.2);
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 24px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button {
      font: inherit;
      color: inherit;
      touch-action: manipulation;
    }

    .app-shell {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 16px 40px;
      background: #ffffff;
    }

    .screen-title {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 0 0 34px;
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 900;
      line-height: 1.1;
    }

    .screen-title::after {
      content: "";
      height: 3px;
      flex: 1;
      background: var(--line);
    }

    .category-heading {
      margin: 38px 0 18px;
      text-align: center;
      font-size: clamp(34px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.15;
    }

    .category-heading span {
      margin: 0 10px;
      font-size: 0.78em;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
      border: 3px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    .category-button {
      min-height: 106px;
      padding: 12px 8px;
      border: 0;
      border-right: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      background: #ffffff;
      font-size: clamp(25px, 6.2vw, 36px);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      word-break: keep-all;
    }

    .category-button:nth-child(3n) {
      border-right: 0;
    }

    .category-button:nth-last-child(-n + 3) {
      border-bottom: 0;
    }

    .category-button:active,
    .recipe-card:active,
    .nav-button:active,
    .large-button:active,
    .ingredient-button:active {
      transform: scale(0.985);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 74px 1fr auto;
      align-items: center;
      gap: 8px;
      margin: -26px -16px 20px;
      padding: 16px;
      border-bottom: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      min-height: 66px;
      border: 0;
      background: transparent;
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
    }

    .current-category {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 66px;
      font-size: clamp(30px, 7.2vw, 42px);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .sort-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 0 6px;
      font-size: clamp(24px, 5.8vw, 34px);
      font-weight: 800;
      white-space: nowrap;
    }

    .recipe-list {
      display: grid;
      gap: 26px;
    }

    .recipe-card {
      display: grid;
      grid-template-columns: minmax(132px, 38%) 1fr;
      gap: 18px;
      width: 100%;
      min-height: 178px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .thumb {
      position: relative;
      min-height: 178px;
      overflow: hidden;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: linear-gradient(135deg, #f4dfb8, #b94a20);
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.18);
    }

    .thumb::after {
      content: attr(data-short);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 900;
      text-shadow: 0 2px 0 #ffffff;
    }

    .thumb.jorim { background: linear-gradient(135deg, #9b3b15, #f4c27a 52%, #482111); }
    .thumb.kimchi { background: linear-gradient(135deg, #fff3d6, #e95a24 56%, #2f7d32); }
    .thumb.tang { background: linear-gradient(135deg, #d93025, #ffbf3f 48%, #2364aa); }
    .thumb.jjim { background: linear-gradient(135deg, #63320f, #d99a45 50%, #f8e3b0); }
    .thumb.namul { background: linear-gradient(135deg, #f6f1d5, #7cb342 52%, #ffffff); }

    .recipe-title {
      margin: 4px 0 6px;
      color: var(--green);
      font-size: clamp(30px, 7.2vw, 42px);
      font-weight: 900;
      line-height: 1.12;
      word-break: keep-all;
    }

    .recipe-desc {
      display: -webkit-box;
      margin: 0 0 8px;
      overflow: hidden;
      color: #222222;
      font-size: clamp(24px, 5.9vw, 34px);
      font-weight: 650;
      line-height: 1.28;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: clamp(22px, 5.4vw, 30px);
      font-weight: 800;
    }

    .rating {
      color: #111111;
    }

    .star {
      color: var(--gold);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 40px;
      padding: 4px 10px;
      border: 2px solid #c7c7c7;
      border-radius: 8px;
      background: #ffffff;
      color: #333333;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      line-height: 1.05;
    }

    .section-title {
      margin: 34px 0 14px;
      font-size: clamp(34px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.15;
    }

    .detail-title {
      margin: 16px 0 10px;
      color: var(--green);
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 900;
      line-height: 1.08;
      word-break: keep-all;
    }

    .detail-hero {
      min-height: 220px;
      margin-top: 18px;
      border-radius: 18px;
    }

    .ingredient-button {
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 82px;
      padding: 16px 14px;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 0 var(--line-strong);
      font-size: clamp(27px, 6.6vw, 38px);
      font-weight: 850;
      text-align: left;
    }

    .ingredient-button.checked {
      background: #e8f7e8;
      color: #164b19;
    }

    .ingredient-button.checked .ingredient-name {
      text-decoration: line-through;
      text-decoration-thickness: 4px;
    }

    .check-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 3px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      font-size: 32px;
      line-height: 1;
    }

    .step-card {
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      padding: 18px 16px;
      box-shadow: 0 4px 0 var(--line-strong);
    }

    .step-number {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: clamp(25px, 6vw, 34px);
      font-weight: 900;
      line-height: 1.1;
    }

    .step-text {
      margin: 0;
      font-size: clamp(27px, 6.6vw, 38px);
      font-weight: 760;
      line-height: 1.44;
    }

    .large-button {
      width: 100%;
      min-height: 88px;
      margin-top: 34px;
      padding: 20px 16px;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: var(--red);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--line-strong);
      font-size: clamp(32px, 8vw, 46px);
      font-weight: 900;
      line-height: 1.14;
      text-align: center;
    }

    .add-button {
      width: 100%;
      min-height: 86px;
      margin-bottom: 24px;
      padding: 18px 16px;
      border: 4px solid var(--line-strong);
      border-radius: 12px;
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--line-strong);
      font-size: clamp(30px, 7.5vw, 44px);
      font-weight: 900;
      line-height: 1.14;
      text-align: center;
    }

    .form-label {
      display: block;
      margin: 22px 0 8px;
      font-size: clamp(28px, 6.8vw, 38px);
      font-weight: 900;
      line-height: 1.15;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: clamp(26px, 6.4vw, 36px);
      font-weight: 750;
      line-height: 1.35;
    }

    .form-input,
    .form-select {
      min-height: 76px;
      padding: 12px 14px;
    }

    .form-textarea {
      min-height: 180px;
      padding: 14px;
      resize: vertical;
    }

    .form-help {
      margin: 8px 0 0;
      color: #444444;
      font-size: clamp(22px, 5.4vw, 30px);
      font-weight: 750;
      line-height: 1.3;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 28px;
    }

    .auto-fill-button {
      width: 100%;
      min-height: 82px;
      margin-top: 18px;
      padding: 18px 14px;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #0f7b3f;
      color: #ffffff;
      box-shadow: 0 5px 0 var(--line-strong);
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 900;
      line-height: 1.14;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .app-shell {
        padding-right: 12px;
        padding-left: 12px;
      }

      .top-bar {
        margin-right: -12px;
        margin-left: -12px;
        padding-right: 12px;
        padding-left: 12px;
        grid-template-columns: 62px 1fr auto;
      }

      .recipe-card {
        grid-template-columns: 132px 1fr;
        gap: 14px;
      }

      .thumb {
        min-height: 160px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="categoryScreen">
      <h1 class="screen-title">레시피 분류</h1>

      <h2 class="category-heading"><span>◎</span>종류별<span>◎</span></h2>
      <div id="kindGrid" class="category-grid"></div>
    </section>

    <section id="listScreen" class="hidden">
      <div class="top-bar">
        <button id="listBackButton" type="button" class="icon-button" aria-label="뒤로">‹</button>
        <div id="listTitle" class="current-category">전체</div>
        <div class="sort-label" aria-label="정렬">☰ 추천순</div>
      </div>
      <button id="openAddButton" type="button" class="add-button">+ 새 메뉴 추가</button>
      <div id="recipeList" class="recipe-list"></div>
    </section>

    <section id="addScreen" class="hidden">
      <div class="top-bar">
        <button id="addBackButton" type="button" class="icon-button" aria-label="뒤로">‹</button>
        <div class="current-category">새 메뉴</div>
        <div class="sort-label">저장</div>
      </div>

      <form id="addRecipeForm">
        <label class="form-label" for="newName">음식 이름</label>
        <input id="newName" class="form-input" type="text" autocomplete="off" required placeholder="예: 오이냉국">

        <label class="form-label" for="newCategory">분류</label>
        <select id="newCategory" class="form-select" required></select>

        <button id="autoFillButton" type="button" class="auto-fill-button">자동으로 채우기</button>
        <p class="form-help">음식 이름과 분류를 보고 준비물과 만드는 법을 먼저 채워줍니다.</p>

        <label class="form-label" for="newIngredients">준비물</label>
        <textarea id="newIngredients" class="form-textarea" required placeholder="한 줄에 하나씩 적으세요.&#10;예: 오이 1개&#10;소금 조금"></textarea>
        <p class="form-help">준비물은 한 줄에 하나씩 적으면 됩니다.</p>

        <label class="form-label" for="newSteps">만드는 법</label>
        <textarea id="newSteps" class="form-textarea" required placeholder="한 줄에 한 단계씩 적으세요.&#10;예: 오이를 썰어 주세요.&#10;양념을 넣고 섞어 주세요."></textarea>
        <p class="form-help">만드는 법도 한 줄에 한 단계씩 적으면 됩니다.</p>

        <div class="button-row">
          <button type="submit" class="large-button">저장하기</button>
          <button id="cancelAddButton" type="button" class="large-button">취소하고 돌아가기</button>
        </div>
      </form>
    </section>

    <section id="detailScreen" class="hidden">
      <div class="top-bar">
        <button id="detailBackButton" type="button" class="icon-button" aria-label="뒤로">‹</button>
        <div id="detailCategory" class="current-category">레시피</div>
        <div class="sort-label">보기</div>
      </div>

      <h1 id="recipeTitle" class="detail-title"></h1>
      <div id="detailHero" class="thumb detail-hero" aria-hidden="true"></div>

      <h2 class="section-title">준비물</h2>
      <div id="ingredientList" class="grid gap-4"></div>

      <h2 class="section-title">만드는 법</h2>
      <div id="stepList" class="grid gap-5"></div>

      <button id="backHomeButton" type="button" class="large-button">처음 화면으로</button>
    </section>
  </main>

          recipes = [...recipes, ...saved];
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function getCustomRecipes() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function showOnly(screen) {
      categoryScreen.classList.toggle("hidden", screen !== "category");

      detailScreen.classList.toggle("hidden", screen !== "detail");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function makeCategoryButton(label) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "category-button";
      button.textContent = label;
      button.addEventListener("click", () => showList(label));
      return button;
    }

    function showList(category) {
      currentCategory = category;
      listTitle.textContent = `⌄ ${category}`;
      recipeList.replaceChildren();

      const filtered = recipes.filter((recipe) => category === "전체" || recipe.categories.includes(category));
      const list = filtered.length ? filtered : recipes;

      list.forEach((recipe) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recipe-card";
        button.innerHTML = `
          <span class="thumb ${recipe.thumb}" data-short="${recipe.short}" aria-hidden="true"></span>
          <span>
            <strong class="recipe-title">${recipe.name}</strong>
            <span class="recipe-desc">${recipe.desc}</span>
            <span class="meta-row">
              <span class="rating"><span class="star">★</span> ${recipe.rating} (${recipe.review})</span>
              <span class="pill">♙ ${recipe.servings}</span>
              <span class="pill">◷ ${recipe.time}</span>
            </span>
          </span>
        `;
        button.addEventListener("click", () => showRecipe(recipe));
        recipeList.append(button);
      });

      showOnly("list");
    }

    function showAddForm() {
      addRecipeForm.reset();
      newCategory.value = kindCategories.includes(currentCategory) && currentCategory !== "전체" ? currentCategory : "밑반찬";
      showOnly("add");
      newName.focus();
    }

    function showRecipe(recipe) {
      recipeTitle.textContent = recipe.name;
      detailCategory.textContent = currentCategory;
      detailHero.className = `thumb detail-hero ${recipe.thumb}`;
      detailHero.dataset.short = recipe.short;
      ingredientList.replaceChildren();
      stepList.replaceChildren();

      recipe.ingredients.forEach((ingredient) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "ingredient-button";
        button.setAttribute("aria-pressed", "false");

        const mark = document.createElement("span");
        mark.className = "check-mark";
        mark.setAttribute("aria-hidden", "true");

        const name = document.createElement("span");
        name.className = "ingredient-name";
        name.textContent = ingredient;

        button.append(mark, name);
        button.addEventListener("click", () => {
          const checked = button.classList.toggle("checked");
          button.setAttribute("aria-pressed", String(checked));
          mark.textContent = checked ? "✓" : "";
        });

        ingredientList.append(button);
      });

      recipe.steps.forEach((step, index) => {
        const card = document.createElement("article");
        card.className = "step-card";
        card.innerHTML = `<strong class="step-number">순서 ${index + 1}</strong><p class="step-text">${step}</p>`;
        stepList.append(card);
      });

      showOnly("detail");
    }

        return;

      const draft = makeAutoRecipe(name, category);
      newIngredients.value = draft.ingredients.join("\n");
      newSteps.value = draft.steps.join("\n");
    });

    addRecipeForm.addEventListener("submit", (event) => {

      const name = newName.value.trim();
      const category = newCategory.value;
      const ingredients = newIngredients.value.split("\n").map((item) => item.trim()).filter(Boolean);
      const steps = newSteps.value.split("\n").map((item) => item.trim()).filter(Boolean);

      if (!name || !category || ingredients.length === 0 || steps.length === 0) {
        alert("음식 이름, 분류, 준비물, 만드는 법을 모두 입력해 주세요.");
        return;
      }

      const recipe = {
        id: `custom-${Date.now()}`,
        name,
        categories: ["전체", category],
        desc: `${name} 직접 추가한 우리집 레시피입니다.`,
        servings: "가족분",
        time: "직접확인",
        rating: "5.0",
        review: "0",
        thumb: thumbByCategory[category] || "jorim",
        short: name.slice(0, 1),
        ingredients,
        steps
      };

      saveCustomRecipe(recipe);
      currentCategory = category;
      showList(category);
    });
  </script>
</body>
