<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엄마 레시피</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #fafaf7;
      --panel: #ffffff;
      --line: #d9d9d9;
      --line-strong: #111111;
      --green: #34780f;
      --blue: #005fcc;
      --red: #b42318;
      --gold: #f5b400;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 95, 204, 0.2);
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 24px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button {
      font: inherit;
      color: inherit;
      touch-action: manipulation;
    }

    .app-shell {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 16px 40px;
      background: #ffffff;
    }

    .screen-title {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 0 0 34px;
      font-size: clamp(40px, 10vw, 58px);
      font-weight: 900;
      line-height: 1.1;
    }

    .screen-title::after {
      content: "";
      height: 3px;
      flex: 1;
      background: var(--line);
    }

    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 390px;
      margin: 0 auto 24px;
    }

    .home-title {
      margin: 0;
      color: #1a1a1a;
      font-size: clamp(32px, 8.6vw, 42px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .search-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 18px;
      background: #ffffff;
      color: #1a1a1a;
      box-shadow: 0 8px 22px rgba(255, 255, 255, 0.9), 0 8px 18px rgba(26, 26, 26, 0.08);
    }

    .category-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 390px;
      margin: 0 auto;
    }

    .category-heading {
      margin: 38px 0 18px;
      text-align: center;
      font-size: clamp(34px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.15;
    }

    .category-heading span {
      margin: 0 10px;
      font-size: 0.78em;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
      border: 3px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    .category-button {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: 1fr auto;
      column-gap: 12px;
      align-items: center;
      min-height: 100px;
      padding: 16px;
      overflow: hidden;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(255, 255, 255, 0.9), 0 10px 20px rgba(26, 26, 26, 0.08);
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      word-break: keep-all;
    }

    .category-button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      pointer-events: none;
    }

    .category-button.all {
      grid-column: 1 / -1;
      min-height: 80px;
    }

    .category-button.all::before { background: linear-gradient(135deg, #8b5cf6, #3b82f6); }
    .category-button.side::before { background: linear-gradient(135deg, #bbf7d0, #86efac); }
    .category-button.main::before { background: linear-gradient(135deg, #fed7aa, #fdba74); }
    .category-button.soup::before { background: linear-gradient(135deg, #fef3c7, #fde68a); }
    .category-button.stew::before { background: linear-gradient(135deg, #fecaca, #fca5a5); }
    .category-button.kimchi::before { background: linear-gradient(135deg, #22c55e, #166534); opacity: 0.24; }
    .category-button.etc::before { background: linear-gradient(135deg, #f3f4f6, #d1d5db); }

    .category-emoji {
      position: relative;
      grid-row: 1 / span 2;
      font-size: 36px;
      line-height: 1;
    }

    .category-name {
      position: relative;
      align-self: end;
      color: #1a1a1a;
      font-size: clamp(22px, 5.8vw, 30px);
      font-weight: 900;
      line-height: 1.08;
    }

    .category-count {
      position: relative;
      align-self: start;
      margin-top: 6px;
      color: #6b6b6b;
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 750;
      line-height: 1.1;
    }

    .category-button:active,
    .recipe-card:active,
    .nav-button:active,
    .large-button:active,
    .ingredient-button:active,
    .add-button:active,
    .auto-fill-button:active,
    .search-button:active {
      transform: scale(0.95);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 74px 1fr auto;
      align-items: center;
      gap: 8px;
      margin: -26px -16px 20px;
      padding: 16px;
      border-bottom: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .list-screen {
      max-width: 390px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    .list-header {
      position: sticky;
      top: 0;
      z-index: 15;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      min-height: 62px;
      margin: -26px -16px 14px;
      padding: 12px 16px 10px;
      border-bottom: 2px solid rgba(26, 26, 26, 0.06);
      background: rgba(250, 250, 247, 0.96);
      backdrop-filter: blur(10px);
    }

    .list-header::after {
      content: "";
      position: absolute;
      right: 16px;
      bottom: 0;
      left: 16px;
      height: 2px;
      border-radius: 999px;
      background: var(--accent-line, #86efac);
    }

    .list-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: #1a1a1a;
    }

    .list-category-title {
      color: #1a1a1a;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .recipe-list {
      display: grid;
      gap: 10px;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      min-height: 66px;
      border: 0;
      background: transparent;
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
    }

    .current-category {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 66px;
      font-size: clamp(30px, 7.2vw, 42px);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .sort-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 0 6px;
      font-size: clamp(24px, 5.8vw, 34px);
      font-weight: 800;
      white-space: nowrap;
    }

    .recipe-card {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 12px;
      width: 100%;
      min-height: 90px;
      padding: 5px 10px 5px 5px;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 2px 10px rgba(26, 26, 26, 0.06);
      text-align: left;
      transition: transform 0.15s ease;
    }

    .thumb {
      position: relative;
      min-height: 178px;
      overflow: hidden;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: linear-gradient(135deg, #f4dfb8, #b94a20);
    }

    .recipe-card .thumb {
      min-height: 80px;
      border: 0;
      border-radius: 16px;
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.18);
    }

    .thumb::after {
      content: attr(data-short);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
      font-size: clamp(34px, 8vw, 52px);
      font-weight: 900;
      text-shadow: 0 2px 0 #ffffff;
    }

    .recipe-card .thumb::before {
      display: none;
    }

    .recipe-card .thumb::after {
      font-size: 24px;
      font-weight: 600;
      text-shadow: none;
    }

    .thumb.jorim { background: linear-gradient(135deg, #9b3b15, #f4c27a 52%, #482111); }
    .thumb.kimchi { background: linear-gradient(135deg, #fff3d6, #e95a24 56%, #2f7d32); }
    .thumb.tang { background: linear-gradient(135deg, #d93025, #ffbf3f 48%, #2364aa); }
    .thumb.jjim { background: linear-gradient(135deg, #63320f, #d99a45 50%, #f8e3b0); }
    .thumb.namul { background: linear-gradient(135deg, #f6f1d5, #7cb342 52%, #ffffff); }

    .recipe-title {
      display: block;
      margin: 3px 0 2px;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.18;
      word-break: keep-all;
    }

    .recipe-desc {
      display: -webkit-box;
      margin: 0 0 6px;
      overflow: hidden;
      color: #6b6b6b;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.25;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
    }

    .rating {
      color: #111111;
    }

    .star {
      color: var(--gold);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 22px;
      padding: 4px 8px;
      border: 0;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.05;
    }

    .list-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 999px;
      background: var(--accent-strong, #15803d);
      color: #ffffff;
      box-shadow: 0 18px 34px rgba(26, 26, 26, 0.28);
      transition: transform 0.15s ease;
    }

    .list-fab:active {
      transform: scale(0.9);
    }

    .sort-sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(26, 26, 26, 0.24);
    }

    .sort-sheet {
      width: 100%;
      max-width: 390px;
      border-radius: 24px 24px 18px 18px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(26, 26, 26, 0.18);
      padding: 10px 12px 14px;
    }

    .sort-sheet-title {
      margin: 8px 6px 10px;
      color: #1a1a1a;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .sort-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 54px;
      padding: 0 14px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
    }

    .sort-option.active {
      background: var(--accent-soft, #dcfce7);
      color: var(--accent-text, #166534);
    }

    .empty-state {
      display: grid;
      justify-items: center;
      gap: 6px;
      padding: 72px 16px;
      text-align: center;
    }

    .empty-emoji {
      font-size: 48px;
      line-height: 1;
    }

    .empty-title {
      margin: 8px 0 0;
      color: #6b6b6b;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
    }

    .empty-desc {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .search-screen {
      max-width: 390px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 18;
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 10px;
      margin: -26px -16px 16px;
      padding: 14px 16px;
      background: rgba(250, 250, 247, 0.97);
      backdrop-filter: blur(10px);
    }

    .search-input {
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 2px 10px rgba(26, 26, 26, 0.06);
      color: #1a1a1a;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft, #dcfce7);
      color: var(--accent-text, #166534);
      font-size: 11px;
      font-weight: 800;
    }

    .search-section-title {
      margin: 4px 0 10px;
      color: #6b6b6b;
      font-size: 13px;
      font-weight: 900;
    }

    .section-title {
      margin: 34px 0 14px;
      font-size: clamp(34px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.15;
    }

    .detail-title {
      margin: 16px 0 10px;
      color: var(--green);
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 900;
      line-height: 1.08;
      word-break: keep-all;
    }

    .detail-screen {
      max-width: 390px;
      margin: 0 auto;
      padding-bottom: 106px;
    }

    .detail-header {
      position: sticky;
      top: 0;
      z-index: 16;
      display: grid;
      grid-template-columns: 48px 1fr 96px;
      align-items: center;
      min-height: 62px;
      margin: -26px -16px 16px;
      padding: 10px 16px;
      background: rgba(250, 250, 247, 0.96);
      backdrop-filter: blur(10px);
    }

    .detail-action-row {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .detail-card {
      overflow: hidden;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(26, 26, 26, 0.08);
    }

    .detail-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 160px;
      color: var(--accent-text, #166534);
      font-size: 48px;
      font-weight: 800;
      background: var(--accent-thumb, linear-gradient(135deg, #dcfce7, #86efac));
    }

    .detail-summary {
      padding: 16px;
    }

    .detail-name {
      margin: 0 0 6px;
      color: #1a1a1a;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.18;
    }

    .detail-desc {
      margin: 0 0 10px;
      color: #6b6b6b;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .detail-section {
      margin-top: 10px;
      padding: 16px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(26, 26, 26, 0.05);
    }

    .detail-section-title {
      margin: 0 0 10px;
      color: var(--accent-text, #166534);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .plain-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 20px;
      color: #1a1a1a;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }

    .ordered-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 22px;
      color: #1a1a1a;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }

    .rating-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      border-top: 1px solid rgba(26, 26, 26, 0.08);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 -8px 24px rgba(26, 26, 26, 0.08);
    }

    .rating-bar-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      max-width: 390px;
      min-height: 76px;
      margin: 0 auto;
      padding: 10px 16px;
    }

    .stars {
      display: flex;
      gap: 3px;
    }

    .star-button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: #d1d5db;
      font-size: 28px;
      line-height: 1;
    }

    .star-button.filled {
      color: #f5b400;
    }

    .review-count {
      color: #6b6b6b;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-hero {
      min-height: 220px;
      margin-top: 18px;
      border-radius: 18px;
    }

    .ingredient-button {
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 82px;
      padding: 16px 14px;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 0 var(--line-strong);
      font-size: clamp(27px, 6.6vw, 38px);
      font-weight: 850;
      text-align: left;
    }

    .ingredient-button.checked {
      background: #e8f7e8;
      color: #164b19;
    }

    .ingredient-button.checked .ingredient-name {
      text-decoration: line-through;
      text-decoration-thickness: 4px;
    }

    .check-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: 3px solid var(--line-strong);
      border-radius: 8px;
      background: #ffffff;
      font-size: 32px;
      line-height: 1;
    }

    .step-card {
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      padding: 18px 16px;
      box-shadow: 0 4px 0 var(--line-strong);
    }

    .step-number {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font-size: clamp(25px, 6vw, 34px);
      font-weight: 900;
      line-height: 1.1;
    }

    .step-text {
      margin: 0;
      font-size: clamp(27px, 6.6vw, 38px);
      font-weight: 760;
      line-height: 1.44;
    }

    .large-button {
      width: 100%;
      min-height: 88px;
      margin-top: 34px;
      padding: 20px 16px;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: var(--red);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--line-strong);
      font-size: clamp(32px, 8vw, 46px);
      font-weight: 900;
      line-height: 1.14;
      text-align: center;
    }

    .outline-back-button {
      width: 100%;
      min-height: 48px;
      margin: 18px 0 24px;
      padding: 0 16px;
      border: 2px solid var(--accent-strong, #2E9E5B);
      border-radius: 12px;
      background: transparent;
      color: var(--accent-strong, #2E9E5B);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .add-button {
      width: 100%;
      min-height: 86px;
      margin-bottom: 24px;
      padding: 18px 16px;
      border: 4px solid var(--line-strong);
      border-radius: 12px;
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--line-strong);
      font-size: clamp(30px, 7.5vw, 44px);
      font-weight: 900;
      line-height: 1.14;
      text-align: center;
    }

    .form-label {
      display: block;
      margin: 22px 0 8px;
      font-size: clamp(28px, 6.8vw, 38px);
      font-weight: 900;
      line-height: 1.15;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      border: 4px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: clamp(26px, 6.4vw, 36px);
      font-weight: 750;
      line-height: 1.35;
    }

    .form-input,
    .form-select {
      min-height: 76px;
      padding: 12px 14px;
    }

    .form-textarea {

    function openPhotoDb() {
      if (photoDbPromise) {
        return photoDbPromise;
      }

      photoDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(PHOTO_DB_NAME, 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE_NAME)) {
            const store = db.createObjectStore(PHOTO_STORE_NAME, { keyPath: "id" });
            store.createIndex("recipeKey", "recipeKey", { unique: false });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      return photoDbPromise;
    }

    async function saveRecipePhoto(recipeKey, dataUrl) {
      const db = await openPhotoDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE_NAME, "readwrite");
        const store = tx.objectStore(PHOTO_STORE_NAME);
        store.put({
          id: `${recipeKey}-${Date.now()}`,
          recipeKey,
          dataUrl,
          createdAt: Date.now()
        });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getRecipePhotos(recipeKey) {
      const db = await openPhotoDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE_NAME, "readonly");
        const store = tx.objectStore(PHOTO_STORE_NAME);
        const index = store.index("recipeKey");
        const request = index.getAll(recipeKey);
        request.onsuccess = () => resolve(request.result.sort((a, b) => b.createdAt - a.createdAt));
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteRecipePhoto(photoId) {
      const db = await openPhotoDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE_NAME, "readwrite");
        tx.objectStore(PHOTO_STORE_NAME).delete(photoId);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const maxSize = 1100;
            const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
            const width = Math.round(image.width * scale);
            const height = Math.round(image.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          image.onerror = reject;
          image.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        const photos = getLocalPhotos(recipeKey);
        emptyPhotos.classList.toggle("hidden", photos.length > 0);

        photos.forEach((photo) => {
          const card = document.createElement("article");
          card.className = "photo-card";

          const image = document.createElement("img");
          image.className = "food-photo";
          image.src = photo.dataUrl;
          image.alt = `${recipe.name} 음식 사진`;

          const button = document.createElement("button");
          button.type = "button";
          button.className = "delete-photo-button";
          button.textContent = "사진 삭제";
          button.addEventListener("click", async () => {
            if (confirm("이 사진을 삭제할까요?")) {
              await deleteRecipePhoto(photo.id);
              deleteLocalPhoto(recipeKey, photo.id);
              renderPhotos(recipe);
            }
          });

          card.append(image, button);
          photoList.append(card);
        });
      } catch {
        emptyPhotos.textContent = "사진 저장소를 열 수 없습니다.";
        emptyPhotos.classList.remove("hidden");
      }
    }

    function loadCustomRecipes() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(saved)) {
          recipes = [...recipes, ...saved];
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function getCustomRecipes() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveCustomRecipe(recipe) {
      const saved = getCustomRecipes();
      saved.unshift(recipe);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      recipes.unshift(recipe);
    }

    function deleteCustomRecipe(recipe) {
      if (!recipe || !recipe.id) {
        return false;
      }
      const saved = getCustomRecipes().filter((item) => item.id !== recipe.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      recipes = recipes.filter((item) => item.id !== recipe.id);
      return true;
    }

        "애호박", "계란", "어묵", "오이", "시금치", "가지", "깻잎"

    function showOnly(screen) {
      categoryScreen.classList.toggle("hidden", screen !== "category");
      searchScreen.classList.toggle("hidden", screen !== "search");
      listScreen.classList.toggle("hidden", screen !== "list");
      addScreen.classList.toggle("hidden", screen !== "add");
      detailScreen.classList.toggle("hidden", screen !== "detail");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function getRecentRecipeKeys() {
      try {
        return JSON.parse(localStorage.getItem("mamicook_recent_recipes") || "[]");
      } catch {
        return [];
      }
    }

    function saveRecentRecipe(recipe) {
      const key = getRecipeKey(recipe);
      const keys = [key, ...getRecentRecipeKeys().filter((item) => item !== key)].slice(0, 3);
      localStorage.setItem("mamicook_recent_recipes", JSON.stringify(keys));
    }

    function makeRecipeCard(recipe, includeBadge = false) {
      const recipeCategory = getRecipeCategory(recipe);
      const accent = getCategoryAccent(recipeCategory);
      const meta = categoryMeta[recipeCategory] || { label: recipeCategory };
      const button = document.createElement("button");
      button.type = "button";
      button.className = "recipe-card";
      button.innerHTML = `
        <span class="thumb ${recipe.thumb}" data-short="${recipe.short}" style="background: ${accent.thumb}; color: ${accent.text};" aria-hidden="true"></span>
        <span>
          <strong class="recipe-title">${recipe.name}</strong>
          <span class="recipe-desc">${recipe.desc}</span>
          <span class="meta-row">
            ${includeBadge ? `<span class="category-badge" style="--accent-soft:${accent.soft}; --accent-text:${accent.text};">${meta.label}</span>` : ""}
            <span class="pill"><span class="star">★</span>${recipe.rating}(${recipe.review})</span>
            <span class="pill">${recipe.servings}</span>
            <span class="pill">⏱${recipe.time}</span>
          </span>
        </span>
      `;
      button.addEventListener("click", () => showRecipe(recipe));
      return button;
    }

    function makeCategoryButton(label) {
      const meta = categoryMeta[label] || { emoji: "🍚", className: "etc", label };
      const count = recipes.filter((recipe) => label === "전체" || recipe.categories.includes(label)).length;
      const button = document.createElement("button");
      button.type = "button";
      button.className = `category-button ${meta.className}`;
      button.innerHTML = `
        <span class="category-emoji" aria-hidden="true">${meta.emoji}</span>
        <strong class="category-name">${meta.label}</strong>
        <span class="category-count">${count}개 레시피</span>
      `;
      button.addEventListener("click", () => showList(label));
      return button;
    }

    function renderCategoryGrid() {
      kindGrid.replaceChildren();
      kindCategories.forEach((category) => kindGrid.append(makeCategoryButton(category)));
    }

    function showList(category) {
      currentCategory = category;
      const meta = categoryMeta[category] || { emoji: "🍚", label: category };
      const accent = getCategoryAccent(category);
      listTitle.textContent = meta.label;
      applyListAccent(category);
      recipeList.replaceChildren();

      const filtered = recipes.filter((recipe) => category === "전체" || recipe.categories.includes(category));
      const list = sortRecipeList(filtered);
      emptyState.classList.toggle("hidden", list.length > 0);
      emptyEmoji.textContent = meta.emoji;

      list.forEach((recipe) => {
        recipeList.append(makeRecipeCard(recipe));
      });

      showOnly("list");
    }

    function recipeMatches(recipe, query) {
      const haystack = [
        recipe.name,
        recipe.desc,
        ...(recipe.ingredients || [])
      ].join(" ").toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

    function renderSearchResults() {
      const query = searchInput.value.trim();
      searchResults.replaceChildren();
      searchEmptyState.classList.add("hidden");

      if (!query) {
        searchSectionTitle.textContent = "최근 본 레시피";
        const recent = getRecentRecipeKeys()
          .map((key) => recipes.find((recipe) => getRecipeKey(recipe) === key))
          .filter(Boolean)
          .slice(0, 3);
        recent.forEach((recipe) => searchResults.append(makeRecipeCard(recipe, true)));
        searchEmptyState.classList.toggle("hidden", recent.length > 0);
        if (!recent.length) {
          searchSuggestion.textContent = "검색어를 입력하면 레시피를 찾을 수 있어요";
        }
        return;
      }

      const results = recipes.filter((recipe) => recipeMatches(recipe, query));
      searchSectionTitle.textContent = `검색 결과 ${results.length}개`;
      results.forEach((recipe) => searchResults.append(makeRecipeCard(recipe, true)));
      searchEmptyState.classList.toggle("hidden", results.length > 0);
      if (!results.length) {
        searchSuggestion.textContent = `"${query}" 대신 재료명이나 짧은 음식명으로 검색해보세요`;
      }
    }

    function showSearch() {
      showOnly("search");
      renderSearchResults();
      setTimeout(() => searchInput.focus(), 50);
    }

    function renderSortOptions() {
      sortOptionsEl.replaceChildren();
      const accent = getCategoryAccent(currentCategory);
      sortOptionsEl.style.setProperty("--accent-soft", accent.soft);
      sortOptionsEl.style.setProperty("--accent-text", accent.text);

      sortOptions.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `sort-option ${currentSort === option.key ? "active" : ""}`;
        button.innerHTML = `<span>${option.label}</span><span>${currentSort === option.key ? "✓" : ""}</span>`;
        button.addEventListener("click", () => {
          currentSort = option.key;
          sortSheet.classList.add("hidden");
          showList(currentCategory);
        });
        sortOptionsEl.append(button);
      });
    }

    function showAddForm() {
      addRecipeForm.reset();
      draftCategory = kindCategories.includes(currentCategory) && currentCategory !== "전체" ? currentCategory : "밑반찬";
      draftServings = 2;
      draftTime = 30;
      renderCategoryChips();
      renderSteppers();
      renderIngredientRows(["", "", ""]);
      renderStepRows(["", "", ""]);
      newTips.value = "";
      updateAddAccent();
      updateSaveState();
      showOnly("add");
      newName.focus();
    }

    function updateAddAccent() {
      const accent = getCategoryAccent(draftCategory);
      addHeader.style.setProperty("--accent-strong", accent.strong);
      categoryChips.style.setProperty("--accent-strong", accent.strong);
      ingredientRows.style.setProperty("--accent-text", accent.text);
      stepRows.style.setProperty("--accent-text", accent.text);
      document.querySelectorAll(".add-row-button").forEach((button) => {
        button.style.setProperty("--accent-soft", accent.soft);
        button.style.setProperty("--accent-text", accent.text);
      });
    }

    function renderCategoryChips() {
      categoryChips.replaceChildren();
      kindCategories.forEach((category) => {
        const meta = categoryMeta[category] || { label: category };
        const button = document.createElement("button");
        button.type = "button";
        button.className = `category-chip ${draftCategory === category ? "selected" : ""}`;
        button.textContent = meta.label;
        button.addEventListener("click", () => {
          draftCategory = category;
          renderCategoryChips();
          updateAddAccent();
          updateSaveState();
        });
        categoryChips.append(button);
      });
    }

    function renderSteppers() {
      servingValue.textContent = `${draftServings}인분`;
      timeValue.textContent = `${draftTime}분`;
    }

    function makeIngredientRow(name = "", amount = "") {
      const row = document.createElement("div");
      row.className = "dynamic-row";
      row.innerHTML = `
        <input class="small-input ingredient-name-input" type="text" placeholder="재료명" value="${name}">
        <input class="small-input ingredient-amount-input" type="text" placeholder="양" value="${amount}">
        <button type="button" class="row-delete-button" aria-label="재료 삭제">×</button>
      `;
      row.querySelector(".row-delete-button").addEventListener("click", () => row.remove());
      return row;
    }

    function renderIngredientRows(values) {
      ingredientRows.replaceChildren();
      values.forEach((value) => {
        if (typeof value === "string") {
          ingredientRows.append(makeIngredientRow(value, ""));
        } else {
          ingredientRows.append(makeIngredientRow(value.name, value.amount));
        }
      });
    }

    function makeStepRow(text = "") {
      const row = document.createElement("div");
      row.className = "step-row";
      const index = document.createElement("span");
      index.className = "step-index";
      const input = document.createElement("input");
      input.className = "small-input step-input";
      input.type = "text";
      input.placeholder = "조리 순서";
      input.value = text;
      row.append(index, input);
      return row;
    }

    function renumberStepRows() {
      [...stepRows.querySelectorAll(".step-row")].forEach((row, index) => {
        row.querySelector(".step-index").textContent = `${index + 1}.`;
      });
    }

    function renderStepRows(values) {
      stepRows.replaceChildren();
      values.forEach((value) => stepRows.append(makeStepRow(value)));
      renumberStepRows();
    }

    function updateSaveState() {
      saveRecipeButton.disabled = !newName.value.trim() || !draftCategory;
    }

    function collectIngredients() {
      return [...ingredientRows.querySelectorAll(".dynamic-row")]
        .map((row) => {
          const name = row.querySelector(".ingredient-name-input").value.trim();
          const amount = row.querySelector(".ingredient-amount-input").value.trim();
          return [name, amount].filter(Boolean).join(" ");
        })
        .filter(Boolean);
    }

    function collectSteps() {
      return [...stepRows.querySelectorAll(".step-input")]
        .map((input) => input.value.trim())
        .filter(Boolean);
    }

    function showRecipe(recipe) {
      currentRecipe = recipe;
      saveRecentRecipe(recipe);
      const recipeCategory = getRecipeCategory(recipe);
      const meta = categoryMeta[recipeCategory] || { label: recipeCategory };
      const accent = getCategoryAccent(recipeCategory);
      recipeTitle.textContent = recipe.name;
      recipeDesc.textContent = recipe.desc || "";
      detailCategory.textContent = meta.label;
      detailHero.textContent = recipe.short || recipe.name.slice(0, 1);
      detailHero.style.setProperty("--accent-thumb", accent.thumb);
      detailHero.style.setProperty("--accent-text", accent.text);
      photoAddBox.style.setProperty("--accent-strong", accent.strong);
      document.querySelector("#backHomeButton").style.setProperty("--accent-strong", accent.strong);
      detailMeta.innerHTML = `
        <span class="pill"><span class="star">★</span>${recipe.rating}(${recipe.review})</span>
        <span class="pill">${recipe.servings}</span>
        <span class="pill">⏱${recipe.time}</span>
      `;
      ingredientList.replaceChildren();
      stepList.replaceChildren();

      recipe.ingredients.forEach((ingredient) => {
        const item = document.createElement("li");
        item.textContent = ingredient;
        ingredientList.append(item);
      });

      recipe.steps.forEach((step) => {
        const item = document.createElement("li");
        item.textContent = step;
        stepList.append(item);
      });

      if (recipe.tips) {
        tipsText.textContent = recipe.tips;
        tipsSection.classList.remove("hidden");
      } else {
        tipsSection.classList.add("hidden");
      }

      renderStarRating(recipe);

      showOnly("detail");
      renderPhotos(recipe);
    }


    loadCustomRecipes();
    renderCategoryGrid();

    document.querySelector("#listBackButton").addEventListener("click", () => showOnly("category"));
    document.querySelector("#openSearchButton").addEventListener("click", showSearch);
    document.querySelector("#closeSearchButton").addEventListener("click", () => {
      searchInput.value = "";
      showOnly("category");
    });
    searchInput.addEventListener("input", renderSearchResults);
    document.querySelector("#sortButton").addEventListener("click", () => {
      renderSortOptions();
      sortSheet.classList.remove("hidden");
    });
    sortSheet.addEventListener("click", (event) => {
      if (event.target === sortSheet) {
        sortSheet.classList.add("hidden");
      }
    });
    document.querySelector("#detailBackButton").addEventListener("click", () => showList(currentCategory));
    document.querySelector("#deleteRecipeButton").addEventListener("click", () => {
      if (!currentRecipe) {
        return;
      }

      if (!currentRecipe.id) {
        alert("기본 레시피는 삭제할 수 없습니다.");
        return;
      }

      if (confirm("이 레시피를 삭제할까요?")) {
        const category = getRecipeCategory(currentRecipe);
        deleteCustomRecipe(currentRecipe);
        renderCategoryGrid();
        showList(category);
      }
    });
    document.querySelector("#openAddButton").addEventListener("click", showAddForm);
    document.querySelector("#addBackButton").addEventListener("click", () => showList(currentCategory));
    document.querySelector("#backHomeButton").addEventListener("click", () => showList(currentCategory));
    newName.addEventListener("input", updateSaveState);
    document.querySelector("#servingMinus").addEventListener("click", () => {
      draftServings = Math.max(1, draftServings - 1);
      renderSteppers();
    });
    document.querySelector("#servingPlus").addEventListener("click", () => {
      draftServings = Math.min(10, draftServings + 1);
      renderSteppers();
    });
    document.querySelector("#timeMinus").addEventListener("click", () => {
      draftTime = Math.max(5, draftTime - 5);
      renderSteppers();
    });
    document.querySelector("#timePlus").addEventListener("click", () => {
      draftTime = Math.min(180, draftTime + 5);
      renderSteppers();
    });
    document.querySelector("#addIngredientButton").addEventListener("click", () => {
      ingredientRows.append(makeIngredientRow());
    });
    document.querySelector("#addStepButton").addEventListener("click", () => {
      stepRows.append(makeStepRow());
      renumberStepRows();
    });
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file || !currentRecipe) {
        return;
      }

      try {
        const dataUrl = await compressImage(file);
        savePhotoToLocalStorage(getRecipeKey(currentRecipe), dataUrl);
        photoInput.value = "";
        renderPhotos(currentRecipe);
      } catch {
        alert("사진을 저장하지 못했습니다. 다른 사진으로 다시 시도해 주세요.");
      }
    });

    addRecipeForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = newName.value.trim();
      const category = draftCategory;
      const ingredients = collectIngredients();
      const steps = collectSteps();

      if (!name || !category) {
        alert("레시피명과 카테고리를 입력해 주세요.");
        return;
      }

      const recipe = {
        id: `custom-${Date.now()}`,
        name,
        categories: ["전체", category],
        desc: newDesc.value.trim() || `${name} 직접 추가한 우리집 레시피입니다.`,
        servings: `${draftServings}인분`,
        time: `${draftTime}분`,
        rating: "5.0",
        review: "0",
        thumb: thumbByCategory[category] || "jorim",
        short: name.slice(0, 1),
        ingredients: ingredients.length ? ingredients : ["재료를 입력해 주세요."],
        steps: steps.length ? steps : ["조리 순서를 입력해 주세요."],
        tips: newTips.value.trim()
      };

      saveCustomRecipe(recipe);
      renderCategoryGrid();
      currentCategory = category;
      showList(category);
    });
  </script>
</body>
</html>
